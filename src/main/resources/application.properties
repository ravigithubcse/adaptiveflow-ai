spring.application.name=AdaptiveFlow AI
server.port=8080

# Database Configuration (SQL Server - configured for demo with H2)
spring.datasource.url=jdbc:h2:mem:adaptiveflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Server Configuration (Production)
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AdaptiveFlowDB;encrypt=true;trustServerCertificate=true
# spring.datasource.username=adaptiveflow_user
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI Configuration - Replace with your actual API key
ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key-here}
ai.openai.model=gpt-4o-mini
ai.openai.endpoint=https://api.openai.com/v1/chat/completions

# Logging
logging.level.com.adaptiveflow=INFO
logging.level.org.springframework.web.socket=INFO

# Application Properties
adaptiveflow.data.simulation.enabled=true
adaptiveflow.data.simulation.interval-ms=3000
adaptiveflow.anomaly.threshold=2.5
adaptiveflow.prediction.window-minutes=30
